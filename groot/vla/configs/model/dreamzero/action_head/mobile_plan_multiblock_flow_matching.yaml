# @package _global_

defaults:
  - wan_flow_matching_action_tf
  - _self_

max_action_dim: 21
num_action_per_block: 4

action_head_cfg:
  _target_: groot.vla.model.dreamzero.action_head.mobile_plan_multiblock_flow_matching.MobilePlanMultiBlockFlowMatchingActionHead
  config:
    _target_: groot.vla.model.dreamzero.action_head.mobile_plan_multiblock_flow_matching.MobilePlanMultiBlockPolicyHeadConfig
    action_dim: ${max_manipulator_action_dim}
    action_horizon: ${action_horizon}
    plan_horizon: ${plan_horizon}
    num_plan_blocks: ${num_plan_blocks}
    plan_waypoints_per_block: ${plan_waypoints_per_block}
    plan_local_offsets: ${plan_local_offsets}
    base_action_dim: ${base_action_dim}
    manipulator_action_dim: ${max_manipulator_action_dim}
    plan_time_offsets: ${plan_local_offsets}
    control_fps: ${control_fps}
    base_flow_loss_weight: 1.0
    manipulator_flow_loss_weight: 1.0
    plan_stats_path: ${mobilemanibench_plan_stats_path}
    plan_component_loss_weight: 0.0
    base_eef_consistency_loss_weight: 0.0
    diffusion_model_cfg:
      _target_: groot.vla.model.dreamzero.modules.wan_video_dit_dual_plan_multiblock.WanVideoDiTMultiBlockDualPlan
      action_dim: ${max_manipulator_action_dim}
      num_action_per_block: ${num_action_per_block}
      plan_waypoints_per_block: ${plan_waypoints_per_block}
      plan_local_offsets: ${plan_local_offsets}
      base_action_dim: ${base_action_dim}
      manipulator_action_dim: ${max_manipulator_action_dim}
      max_state_dim: ${max_state_dim}
      control_fps: ${control_fps}
