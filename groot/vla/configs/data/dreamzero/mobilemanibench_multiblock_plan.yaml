# @package _global_

defaults:
  - dreamzero/base_48_wan_fine_aug_relative
  - _self_

mobilemanibench_data_root: ???
mobilemanibench_plan_label_source: dynamic
relative_action: false
num_plan_blocks: 4
plan_horizon: 7
plan_waypoints_per_block: 7
plan_local_offsets: [1, 2, 4, 8, 16, 32, 48]
block_anchor_offsets: [0, 48, 96, 144]
# EEF xyz stays in the block-anchor Base frame; only rotation becomes a
# principal rotvec from the current anchor EEF to the future EEF.
# anchor_base_rotation6d, current_eef_delta_rotvec
eef_rotation_representation: anchor_base_rotation6d
mobilemanibench_plan_stats_path: ???
base_action_dim: 4
max_manipulator_action_dim: 21
control_fps: 30.0
video_fps: 5.0
video_sample_stride: 6
max_chunk_size: 4
num_frames: 33
action_horizon: 14
state_horizon: 1
mobilemanibench_split_manifest: ${mobilemanibench_data_root}/meta/plan_splits.json
max_eval_samples: 1024
phase_index_path: ${mobilemanibench_data_root}/meta/phase_index.jsonl

prior:
  time_offsets: [4, 16, 32, 48]
  predict_base: true
  predict_eef: true
  eef_frame: future_base

sampling:
  # Keep task balancing opt-in until the first phase-index QA is reviewed.
  task_balanced: false
  phase_balanced_ratio: 0.7
  natural_ratio: 0.3
  balance_block_slots: true
  balance_waypoint_horizons: true
  window_stride:
    navigation: 4
    approach: 2
    grasp: 1
    manipulation: 1

success_hold:
  enabled: true
  min_success_frames: 4

phase_index:
  progress_threshold: 0.02
  persistent_frames: 4
  approach_lead_seconds: 2.0
  grasp_lead_seconds: 0.5

inference:
  prediction_horizon_ticks: 48
  execution_horizon_ticks: 16
  rebuild_cache_from_real_history: true

mobilemanibench_plan_dataset:
  _target_: groot.vla.data.dataset.MobileManiBenchBlockPlanDataset
  dataset_path: ${mobilemanibench_data_root}
  video_delta_indices: [0]
  load_videos: true
  video_backend: decord
  max_manipulator_dim: ${max_manipulator_action_dim}
  label_source: ${mobilemanibench_plan_label_source}
  block_anchor_offsets: ${block_anchor_offsets}
  plan_local_offsets: ${plan_local_offsets}
  eef_rotation_representation: ${eef_rotation_representation}

train_dataset:
  _target_: groot.vla.data.dataset.MobileManiBenchBlockPlanDataset
  dataset_path: ${mobilemanibench_data_root}
  video_delta_indices: [
    0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60,
    66, 72, 78, 84, 90, 96, 102, 108, 114, 120,
    126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192
  ]
  load_videos: true
  video_backend: decord
  max_manipulator_dim: ${max_manipulator_action_dim}
  label_source: ${mobilemanibench_plan_label_source}
  block_anchor_offsets: ${block_anchor_offsets}
  plan_local_offsets: ${plan_local_offsets}
  eef_rotation_representation: ${eef_rotation_representation}
  split: train
  split_manifest_path: ${mobilemanibench_split_manifest}
  require_full_video_window: false
  success_hold: ${success_hold}
  sampling: ${sampling}
  phase_index_path: ${phase_index_path}
  plan_transform:
    _target_: groot.vla.data.transform.ComposedModalityTransform
    transforms:
      - _target_: groot.vla.data.transform.MobileBlockPlanTransform
        stats_path: ${mobilemanibench_plan_stats_path}
        num_plan_blocks: ${num_plan_blocks}
        plan_waypoints_per_block: ${plan_waypoints_per_block}
        block_anchor_offsets: ${block_anchor_offsets}
        plan_local_offsets: ${plan_local_offsets}
        eef_rotation_representation: ${eef_rotation_representation}
      - ${model_specific_transform}

val_dataset:
  _target_: groot.vla.data.dataset.MobileManiBenchBlockPlanDataset
  dataset_path: ${mobilemanibench_data_root}
  video_delta_indices: [
    0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60,
    66, 72, 78, 84, 90, 96, 102, 108, 114, 120,
    126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192
  ]
  load_videos: true
  video_backend: decord
  max_manipulator_dim: ${max_manipulator_action_dim}
  label_source: ${mobilemanibench_plan_label_source}
  block_anchor_offsets: ${block_anchor_offsets}
  plan_local_offsets: ${plan_local_offsets}
  eef_rotation_representation: ${eef_rotation_representation}
  split: val
  split_manifest_path: ${mobilemanibench_split_manifest}
  max_samples: ${max_eval_samples}
  require_full_video_window: false
  require_complete_first_block: true
  success_hold: ${success_hold}
  plan_transform:
    _target_: groot.vla.data.transform.ComposedModalityTransform
    transforms:
      - _target_: groot.vla.data.transform.MobileBlockPlanTransform
        stats_path: ${mobilemanibench_plan_stats_path}
        num_plan_blocks: ${num_plan_blocks}
        plan_waypoints_per_block: ${plan_waypoints_per_block}
        block_anchor_offsets: ${block_anchor_offsets}
        plan_local_offsets: ${plan_local_offsets}
        eef_rotation_representation: ${eef_rotation_representation}
      - ${model_specific_transform}
